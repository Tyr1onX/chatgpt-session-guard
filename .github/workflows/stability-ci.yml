name: Stability CI

on:
  push:
    branches:
      - fix/ultra-lite-stability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, test, build
        run: npm run check

      - name: Audit
        run: npm audit --audit-level=high

      - name: Build debug stability package
        run: npm run build:debug

      - name: Upload debug stability package
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-session-guard-stability-debug-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
