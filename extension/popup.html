<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChatGPT Session Guard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header>
      <div>
        <h1>ChatGPT Session Guard</h1>
        <p id="statusText">Status: ON</p>
      </div>
      <span id="statusDot" class="dot"></span>
    </header>

    <label>Mode
      <select id="mode">
        <option value="safe">Safe</option>
        <option value="balanced">Balanced</option>
        <option value="aggressive">Aggressive · experimental</option>
      </select>
    </label>

    <label>Recent rounds
      <input id="recentRounds" type="number" min="4" max="20" step="1">
    </label>

    <div class="row"><span>DOM budget</span><strong>Auto · 7k</strong></div>
    <div class="row"><span>Session</span><strong id="sessionState">Checking…</strong></div>

    <div class="actions">
      <button id="toggleEnabled" type="button">Disable</button>
      <button id="fullHistory" type="button" class="secondary">Temporary Full History</button>
    </div>

    <p id="warning" class="warning" hidden>Aggressive mode removes settled old turn subtrees until ChatGPT is reloaded.</p>

    <!-- CSG_DEBUG_START -->
    <section id="benchmarkSection" class="benchmark">
      <div class="benchmark-heading">
        <h2>Benchmark</h2>
        <span class="debug-badge">Debug</span>
      </div>
      <div class="row"><span>Conversations</span><strong id="benchmarkConversations">—</strong></div>
      <div class="row"><span>Mode</span><strong id="benchmarkMode">Idle</strong></div>
      <div class="row"><span>Progress</span><strong id="benchmarkProgress">0 / 50</strong></div>
      <div class="row"><span>DOM</span><strong id="benchmarkDom">—</strong></div>
      <div class="row"><span>Heap</span><strong id="benchmarkHeap">—</strong></div>
      <div class="row"><span>Latency</span><strong id="benchmarkLatency">—</strong></div>
      <label>Run length
        <select id="benchmarkLoops">
          <option value="5">50 switches / mode</option>
          <option value="10">100 switches / mode</option>
        </select>
      </label>
      <p id="benchmarkMessage" class="benchmark-message">Control → Balanced → Aggressive. Hard Switch stays off.</p>
      <div class="benchmark-actions">
        <button id="benchmarkStart" type="button">Start Benchmark</button>
        <button id="benchmarkResume" type="button" class="secondary" hidden>Resume Benchmark</button>
        <button id="benchmarkStop" type="button" class="secondary" hidden>Stop Benchmark</button>
      </div>
      <div id="benchmarkDownloads" class="benchmark-actions" hidden>
        <button id="benchmarkJson" type="button" class="secondary">Download JSON</button>
        <button id="benchmarkReport" type="button" class="secondary">Download Report</button>
      </div>
      <button id="benchmarkSessionGc" type="button" class="secondary benchmark-gc" hidden>Run Session GC Benchmark</button>
    </section>
    <!-- CSG_DEBUG_END -->

    <details>
      <summary>Debug metrics</summary>
      <dl id="metrics"></dl>
    </details>
  </main>
  <script src="popup.js"></script>
</body>
</html>
